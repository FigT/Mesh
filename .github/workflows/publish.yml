name: Publish to Maven Central
on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  actions: "write"
  contents: "read"

jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout Repository"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
          submodules: true
      - name: "Setup JDK 17"
        uses: "actions/setup-java@v4"
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
      - name: "Validate Gradle Wrapper"
        uses: "gradle/wrapper-validation-action@v1"
      - name: "Make Gradle Wrapper Executable"
        run: "chmod +x ./gradlew"
      - name: "Run Gradle Build"
        uses: "gradle/gradle-build-action@v2"
        with:
          arguments: " build"
      - name: "Publish"
        run: "./gradlew nmcpPublishAggregationToCentralPortal"
        env:
          ORG_GRADLE_PROJECT_nmcpUsername: "${{ secrets.NMCP_TOKEN_USERNAME }}"
          ORG_GRADLE_PROJECT_nmcpPassword: "${{ secrets.NMCP_TOKEN_PASSWORD }}"
          ORG_GRADLE_PROJECT_signingKey: "${{ secrets.FIG_GPG_KEY }}"
          ORG_GRADLE_PROJECT_signingKeyId: "${{ secrets.FIG_GPG_KEY_ID }}"
          ORG_GRADLE_PROJECT_signingPassword: "${{ secrets.FIG_GPG_PASSWORD }}"
